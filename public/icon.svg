<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b2c" />
      <stop offset="50%" stop-color="#0f2a43" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Accent Lines -->
  <path d="M64 160h384M64 256h384M64 352h384M160 64v384M256 64v384M352 64v384" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Isometric Enerpack Box & Cutting Optimization Geometry -->
  <g transform="translate(256, 250) scale(1.15)" filter="url(#glow)">
    <!-- Top Face (Cutting Sheet Grid) -->
    <path d="M0 -90 L120 -25 L0 40 L-120 -25 Z" fill="url(#blueGrad)" opacity="0.95" />
    <!-- Sheet Cut Lines -->
    <path d="M-60 -57.5 L60 7.5 M0 -90 L0 40 M60 -57.5 L-60 7.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7" />
    
    <!-- Left Face (Stack / Stock Depth) -->
    <path d="M-120 -25 L0 40 L0 130 L-120 65 Z" fill="url(#bgGrad)" stroke="#1e3a5f" stroke-width="3" />
    <!-- Right Face (Corrugated Pack / Flutes) -->
    <path d="M120 -25 L0 40 L0 130 L120 65 Z" fill="url(#accentGrad)" opacity="0.95" />
    
    <!-- Cut Blade Indicator / Precision Spark -->
    <circle cx="0" cy="40" r="8" fill="#ffffff" />
    <path d="M-15 40 L15 40 M0 25 L0 55" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Enerpack Brand Monogram 'E' in Clean Font -->
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="4">ENERPACK</text>
  <text x="256" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#10b981" letter-spacing="3">PACKAGING &amp; OPTIMIZER</text>
</svg>
